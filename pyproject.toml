[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spider-buddy"
version = "0.1.0"
description = "High-Quality Animated Spider-Man Interactive Desktop Companion for Windows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "pywin32>=306",
    "psutil>=5.9.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
spider-buddy = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "core*", "overlay*", "ui*", "services*"]
